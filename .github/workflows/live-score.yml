# Skor live MPL ID.
#
# Dijadwalkan setiap 10 menit pada pukul 11:00–00:59 WIB. Setiap run memeriksa
# situs resmi MPL ID tiap 30 detik selama maksimal 50 menit, selama ada match
# yang live atau akan mulai, lalu commit data/live.json + data/live.js hanya
# ketika skor berubah. Tanpa pertandingan, run berhenti setelah satu kali cek.
#
# Jadwal GitHub sering terlambat atau dilewati. Karena itu, saat waktunya habis
# dan match masih live (atau akan mulai dalam 3 jam), run ini memicu run
# berikutnya sendiri (--relay). Cukup satu jadwal yang berhasil jalan untuk
# memantau seluruh hari pertandingan. Website membaca data/live.json ulang
# setiap 30 detik; skor tertinggal kira-kira 1–2 menit dari situs resmi.
name: Skor live MPL ID

on:
  schedule:
    - cron: "*/10 4-17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: live-score
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - name: Atur identitas commit
        run: |
          git config user.name "mpl-live-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Perbarui skor live (maks. 50 menit)
        env:
          GH_TOKEN: ${{ github.token }}
          MPL_PAGES_WORKFLOW: pages.yml
        run: python3 scripts/live_update.py --watch 30 --max-minutes 50 --idle-exit --git --relay live-score.yml
